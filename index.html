<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Las Veraneras | Menú</title>
<link rel="stylesheet" href="styles.css?v=20260501-3">
</head>
<body>
<header class="hero">
  <div class="hero-overlay">
    <h1>Las Veraneras</h1>
    <p>Las Vueltas de Tucurrique</p>
    <div class="hero-actions">
      <button onclick="surpriseMe()">🎲</button>
      <button onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">Menú</button>
    </div>
  </div>
</header>

<main>
  <section class="toolbar">
    <div class="language">
      <button id="btn-es" class="active" onclick="setLang('es')">ES</button>
      <button id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <input id="search" placeholder="Buscar" oninput="render()" />
  </section>

  <nav id="filters" class="filters"></nav>
  <section id="conversion"></section>
  <section id="featured"></section>
  <section id="menu"></section>
</main>

<section id="upsell" class="upsell"></section>
<section id="cart" class="cart">
  <div class="cart-header">
    <strong id="cart-title">Pedido</strong>
    <button onclick="toggleCart()">×</button>
  </div>
  <p id="cart-nudge">🚀 Pedido listo para enviar</p>
  <div id="cart-items"></div>
  <div class="cart-total">
    <span>Total</span>
    <strong id="cart-total">₡0</strong>
  </div>
  <textarea id="order-notes"></textarea>
  <button class="checkout" onclick="checkout()">Enviar</button>
</section>

<button id="cart-fab" class="cart-fab" onclick="toggleCart()">🛒 <span id="cart-count">0</span></button>

<script src="app.js?v=20260501-3"></script>
</body>
</html>
