<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Las Veraneras</title>
<link rel="stylesheet" href="styles.css">
<style>
.admin-wrap{max-width:1100px;margin:auto;padding:1rem}.admin-card{background:rgba(255,255,255,.06);border-radius:18px;padding:1rem;margin:1rem 0;box-shadow:0 8px 20px rgba(0,0,0,.4)}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem}label{display:block;font-size:.8rem;color:#ccc;margin:.4rem 0}input,textarea,select{width:100%;box-sizing:border-box;padding:.65rem;border-radius:10px;border:1px solid #333;background:#101010;color:white}textarea{min-height:80px}.admin-row{border-top:1px solid #333;padding:1rem 0}.admin-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}.danger{background:#8b1e1e}.success{background:#0f7b45}.muted{color:#aaa;font-size:.85rem}.topbar{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap}.status{padding:.5rem .75rem;border-radius:999px;background:#222}.item-editor{background:rgba(0,0,0,.25);border-radius:14px;padding:1rem;margin:.75rem 0}.preview-img{width:100%;height:120px;object-fit:cover;border-radius:12px;background:#222}.small{font-size:.8rem}</style>
</head>
<body>
<header class="hero" style="height:220px"><div class="hero-overlay"><p class="eyebrow">Admin</p><h1>Las Veraneras</h1><p class="location">Editor del menú</p></div></header>
<main class="admin-wrap">
  <section class="admin-card">
    <div class="topbar"><div><h2>Conexión GitHub</h2><p class="muted">Usa un Fine-grained Personal Access Token con acceso de lectura/escritura a Contents para este repo.</p></div><span id="status" class="status">Sin conectar</span></div>
    <label>GitHub token</label><input id="token" type="password" placeholder="github_pat_...">
    <div class="admin-actions"><button onclick="connect()">Conectar</button><button onclick="loadMenu()">Recargar menú</button><button class="success" onclick="saveMenu()">Guardar en GitHub</button></div>
    <p class="muted small">El token no se guarda en el repo. Si marcas “recordar”, solo se guarda en este navegador.</p>
    <label><input id="remember" type="checkbox" style="width:auto"> Recordar token en este navegador</label>
  </section>
  <section class="admin-card">
    <h2>Acciones rápidas</h2>
    <div class="admin-actions"><button onclick="addCategory()">＋ Categoría</button><button onclick="addItem()">＋ Item</button><button onclick="downloadJson()">Descargar respaldo JSON</button><a href="./" style="color:#ffd166;align-self:center">Ver sitio</a></div>
  </section>
  <section id="editor"></section>
</main>
<script>
const owner='sandgraal';const repo='las-veraneras-menu';const path='data/menu.json';const branch='main';
let token='';let sha='';let data={categories:[]};
const headers=()=>({'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'});
function setStatus(t){document.getElementById('status').textContent=t;}
function connect(){token=document.getElementById('token').value.trim();if(!token){alert('Pega un token de GitHub');return;}if(document.getElementById('remember').checked)localStorage.setItem('lv-admin-token',token);setStatus('Conectado');loadMenu();}
async function loadMenu(){if(!token){token=localStorage.getItem('lv-admin-token')||'';document.getElementById('token').value=token;}if(!token){alert('Falta token');return;}setStatus('Cargando...');const res=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`,{headers:headers()});if(!res.ok){setStatus('Error');alert(await res.text());return;}const file=await res.json();sha=file.sha;data=JSON.parse(decodeURIComponent(escape(atob(file.content.replace(/\n/g,'')))));setStatus('Menú cargado');renderEditor();}
function renderEditor(){const root=document.getElementById('editor');root.innerHTML='';data.categories.forEach((cat,ci)=>{const section=document.createElement('section');section.className='admin-card';section.innerHTML=`<div class="topbar"><h2>${cat.emoji||''} ${cat.name?.es||'Categoría'}</h2><button class="danger" onclick="deleteCategory(${ci})">Eliminar categoría</button></div><div class="admin-grid"><div><label>Nombre ES</label><input value="${esc(cat.name?.es)}" oninput="data.categories[${ci}].name.es=this.value"></div><div><label>Name EN</label><input value="${esc(cat.name?.en)}" oninput="data.categories[${ci}].name.en=this.value"></div><div><label>Emoji</label><input value="${esc(cat.emoji)}" oninput="data.categories[${ci}].emoji=this.value"></div></div><div class="admin-actions"><button onclick="addItem(${ci})">＋ Item en esta categoría</button></div><div id="cat-${ci}"></div>`;root.appendChild(section);const items=section.querySelector('#cat-'+ci);cat.items.forEach((item,ii)=>items.appendChild(itemEditor(item,ci,ii)));});}
function itemEditor(item,ci,ii){const div=document.createElement('div');div.className='item-editor';div.innerHTML=`<div class="topbar"><strong>${item.name?.es||'Nuevo item'}</strong><button class="danger" onclick="deleteItem(${ci},${ii})">Eliminar</button></div><div class="admin-grid"><div><label>Nombre ES</label><input value="${esc(item.name?.es)}" oninput="data.categories[${ci}].items[${ii}].name.es=this.value"></div><div><label>Name EN</label><input value="${esc(item.name?.en)}" oninput="data.categories[${ci}].items[${ii}].name.en=this.value"></div><div><label>Precio</label><input value="${esc(item.price)}" oninput="data.categories[${ci}].items[${ii}].price=this.value.replace(/[^0-9]/g,'')"></div><div><label>ID</label><input value="${esc(item.id)}" oninput="data.categories[${ci}].items[${ii}].id=this.value"></div></div><div class="admin-grid"><div><label>Descripción ES</label><textarea oninput="data.categories[${ci}].items[${ii}].description.es=this.value">${esc(item.description?.es)}</textarea></div><div><label>Description EN</label><textarea oninput="data.categories[${ci}].items[${ii}].description.en=this.value">${esc(item.description?.en)}</textarea></div></div><label>Imagen URL</label><input value="${esc(item.image)}" oninput="data.categories[${ci}].items[${ii}].image=this.value;this.nextElementSibling.src=this.value"><img class="preview-img" src="${esc(item.image)}" onerror="this.style.display='none'"><div class="admin-actions"><label><input type="checkbox" ${item.featured?'checked':''} onchange="data.categories[${ci}].items[${ii}].featured=this.checked" style="width:auto"> Featured</label><label><input type="checkbox" ${item.popular?'checked':''} onchange="data.categories[${ci}].items[${ii}].popular=this.checked" style="width:auto"> Popular</label></div>`;return div;}
function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function slug(s){return String(s||'item').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'item'}
function addCategory(){data.categories.push({id:'categoria-'+(data.categories.length+1),emoji:'🍴',name:{es:'Nueva categoría',en:'New Category'},items:[]});renderEditor();}
function deleteCategory(i){if(confirm('Eliminar categoría?')){data.categories.splice(i,1);renderEditor();}}
function addItem(ci=0){if(!data.categories.length)addCategory();const cat=data.categories[ci]||data.categories[0];cat.items.push({id:'nuevo-'+Date.now(),name:{es:'Nuevo item',en:'New item'},description:{es:'',en:''},price:'0',image:'',featured:false,popular:false});renderEditor();}
function deleteItem(ci,ii){if(confirm('Eliminar item?')){data.categories[ci].items.splice(ii,1);renderEditor();}}
async function saveMenu(){if(!token){alert('Falta token');return;}setStatus('Guardando...');data.categories.forEach(c=>c.items.forEach(i=>{if(!i.id)i.id=slug(i.name.es)}));const content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)+'\n')));const res=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{method:'PUT',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({message:'Update menu from admin panel',content,sha,branch})});if(!res.ok){setStatus('Error');alert(await res.text());return;}const out=await res.json();sha=out.content.sha;setStatus('Guardado');alert('Menú guardado. El sitio puede tardar unos minutos en actualizarse.');}
function downloadJson(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='menu.json';a.click();}
window.addEventListener('load',()=>{const saved=localStorage.getItem('lv-admin-token');if(saved){document.getElementById('token').value=saved;document.getElementById('remember').checked=true;}});
</script>
</body>
</html>
